name: Deploy Worker + D1 Migration
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo tree (diagnostic)
        run: |
          echo "===== ROOT ====="
          ls -la
          echo "===== worker/ ====="
          ls -la worker/ || echo "NO worker folder"
          echo "===== find wrangler.toml ====="
          find . -name "wrangler.toml"
          echo "===== find index.js ====="
          find . -name "index.js"
